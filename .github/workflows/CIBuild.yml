name: CI

on:
  push:
    branches:
    - main
    - release/*
    paths-ignore:
    - 'docs/**'
  pull_request:
    branches:
    - main
    paths-ignore:
    - 'docs/**'
    
jobs:
  build:

    runs-on: windows-latest
    
    steps:
    - name: Clone NmeaParser
      uses: actions/checkout@v2.0.0
    
    - name: Setup Visual Studio Command Prompt
      uses: microsoft/setup-msbuild@v2

    - name: Install Android SDK
      run: |
         echo y>license_accepter.txt
         echo y>>license_accepter.txt
         echo y>>license_accepter.txt
         echo y>>license_accepter.txt
         echo y>>license_accepter.txt
         echo y>>license_accepter.txt
         echo y>>license_accepter.txt
         echo y>>license_accepter.txt
         $sdkmanager = "$env:ANDROID_SDK_ROOT\cmdline-tools\latest\bin\sdkmanager.bat"
         if (!(Test-Path $sdkmanager) -and $env:ANDROID_HOME) {
            $sdkmanager = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat"
         }
         cmd /c "\"$sdkmanager\" --licenses < license_accepter.txt"
         cmd /c "\"$sdkmanager\" --install \"platforms;android-24\""
         cmd /c "\"$sdkmanager\" --install \"platforms;android-21\""

    - name: Build
      run: |
        msbuild /restore /t:Build src/NmeaParser.sln /p:Configuration=Release
      
    - name: Tests
      run: |
        dotnet test src/UnitTests/NmeaParser.Tests.NET/bin/Release/net6.0/NmeaParser.Tests.Net.dll -v normal

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: NuGet Packages
        path: artifacts/NuGet/Release
